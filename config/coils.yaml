#config_version=6

#coils

coils:

  # J6 - A

  c_flipper_left_main:
    number: 0-0-2                #------------------------add in coil number for all - make sure auto fire match up
    default_pulse_ms: 30
    #default_pulse_power: .75

  c_flipper_left_hold:
    number: 0-0-3
    allow_enable: true
    #default_hold_power: .75

  c_flipper_right_main:
    number: 0-0-4
    default_pulse_ms: 30
    #default_pulse_power: .75
    
  c_flipper_right_hold:
    number: 0-0-5
    allow_enable: true
    #default_hold_power: .75

  c_drain_eject:
    number: 0-0-6                 #drain hole kicker
    default_pulse_ms: 35
    default_pulse_power: .55

  c_pop_1:
    number: 0-0-8
    default_pulse_ms: 20
    default_pulse_power: .45

  c_pop_3:
    number: 0-0-9
    default_pulse_ms: 20
    default_pulse_power: .45

  c_pop_5:
    number: 0-0-10
    default_pulse_ms: 20
    default_pulse_power: .45

  # c_kickback:
  #   number:

  c_saucer:
    number: 0-0-15
    default_pulse_ms: 20
    default_pulse_power: .55

  c_dragon1_up:
    number: 0-0-11
    default_pulse_ms: 35
    default_pulse_power: .70

  c_dragon2_up:
    number: 0-0-0
    default_pulse_ms: 35
    default_pulse_power: .70

  c_dragon3_up:
    number: 0-0-12
    default_pulse_ms: 35
    default_pulse_power: .70

  c_dragon4_up:
    number: 0-0-13
    default_pulse_ms: 35
    default_pulse_power: .70

  c_dragon5_up:
    number: 0-0-14
    default_pulse_ms: 35
    default_pulse_power: .70
    
#---------------------------------------------------------------------------------------------

#Autofire devices are defined here by switch and what coil is cycled when that switch is active. 

autofire_coils:

  pop_1:
    coil: c_pop_1
    switch: s_pop_1
    disable_events: shutdown, ball_will_end, service_mode_entered

  c_pop_3:
    coil: c_pop_3
    switch: s_pop_3
    disable_events: shutdown, ball_will_end, service_mode_entered

  c_pop_5:
    coil: c_pop_5
    switch: s_pop_5
    disable_events: shutdown, ball_will_end, service_mode_entered

#  kickback:
#    coil: c_kickback
#    switch: s_kickback
#    disable_events: shutdown, ball_will_end, service_mode_entered
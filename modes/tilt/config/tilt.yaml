#config_version=6

#tilt

tilt:
  tilt_warning_switch_tag: tilt_warning          # your tilt bob switches should have this tag
  warnings_to_tilt: 3
  reset_warnings_events: ball_ended      # or game_ended if you prefer
  settle_time: 3s              # time for bob to stop swinging
  multiple_hit_window: 800ms   # ignores bounce / rapid hits
# Optional: customize what happens on tilt

event_player:
  tilt:
    disable_flippers: {}          # already happens by default in most cases
    tilt_reset_bonus: {}          # you had this
    # add any other events you want on full tilt

sound_player:
  tilt_warning:
    dragon_tilt:
      action: play  
  tilt:
    dragon_tilt:
      action: play

slide_player:
  _overwrite: True

widget_player:
  tilt_warning_1:
    tilt_1:
      slide: base
      expire: 3s
  tilt_warning_2:
    tilt_2:
      slide: base
      expire: 3s
  tilt:
    tilted:
      slide: base  
      expire: 3s          
